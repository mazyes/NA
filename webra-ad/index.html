<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>WEBRA 30s Spot</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#07050c;--night:#0a0616;--deep:#140828;--plum:#1d0b3b;--purple:#5b21b6;--violet:#8b5cf6;--lav:#c4b5fd;--white:#f7f5ff}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--deep);transform-origin:0 0;font-family:Inter,sans-serif;color:var(--white)}
.abs{position:absolute;left:0;top:0;box-sizing:border-box}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1800px;perspective-origin:50% 50%}
.p3{transform-style:preserve-3d}
.disp{font-family:'Archivo Black';letter-spacing:-.02em;line-height:1;white-space:nowrap}
.mono{font-family:'JetBrains Mono',monospace}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 20px Inter;background:rgba(0,0,0,.5);cursor:pointer;z-index:9}
</style></head>
<body>
<div id="stage"></div>
<script>
/* ============================================================
   WEBRA — 30s vertical spot. Deterministic timeline: seek(t).
   Edit these two placeholders, then re-render.
   ============================================================ */
const HANDLE = '[ INSTAGRAM HANDLE ]';
const SITE   = '[ WEBSITE URL ]';

const W=1080,H=1920,CX=540,CY=960,DUR=30;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>C((t-a)/(b-a));
const L=(a,b,p)=>a+(b-a)*p;
const E={
  o3:p=>1-Math.pow(1-p,3), o5:p=>1-Math.pow(1-p,5), i3:p=>p*p*p, i5:p=>p*p*p*p*p,
  io3:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  expo:p=>p>=1?1:1-Math.pow(2,-10*p),
  iexpo:p=>p<=0?0:Math.pow(2,10*p-10),
  back:p=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
  soft:p=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},
};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const stage=document.getElementById('stage');

function div(parent,css='',html='',cls=''){const d=document.createElement('div');d.className='abs '+cls;d.style.cssText=css;d.innerHTML=html;parent.appendChild(d);return d}
// centered box: element whose origin is the stage centre
function box(parent,w,h,css='',html='',cls=''){return div(parent,`left:${CX-w/2}px;top:${CY-h/2}px;width:${w}px;height:${h}px;`+css,html,cls)}
function tf(e,o={}){const{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,sx=1,sy=1,sk=0}=o;e.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) skewX(${sk}deg) scale(${s*sx},${s*sy})`}
function op(e,a){a=C(a);e.style.opacity=a;e.style.visibility=a<=.002?'hidden':'visible'}
function show(e,on){e.style.display=on?'':'none'}
// dimensional extrusion via stacked shadows
function extrude(dx,dy,n=14,from=[76,29,149],to=[12,5,24]){let s=[];for(let i=1;i<=n;i++){const k=i/n,c=from.map((v,j)=>Math.round(L(v,to[j],k)));s.push(`${(dx*i).toFixed(2)}px ${(dy*i).toFixed(2)}px 0 rgb(${c})`)}return s.join(',')}

// kinetic text line: mask wrapper + per-word/char spans
function tline(parent,txt,{size=160,y=0,font="'Archivo Black'",weight=400,color='var(--white)',maxW=960,ls=-.02,split='words',mask=true}={}){
  const anchor=div(parent,`left:0;top:${CY+y}px;width:${W}px;height:0;`,'','p3');
  const m=div(anchor,`left:0;width:${W}px;display:flex;justify-content:center;align-items:center;overflow:${mask?'hidden':'visible'};`);
  const inner=div(m,`position:relative;font-family:${font};font-weight:${weight};font-size:${size}px;color:${color};letter-spacing:${ls}em;white-space:nowrap;line-height:1;padding:0 .08em;`);
  const parts=split==='chars'?[...txt]:txt.split(' ');
  const spans=parts.map((p,i)=>{const s=document.createElement('span');s.style.cssText='display:inline-block;will-change:transform;white-space:pre';s.textContent=p+(split==='words'&&i<parts.length-1?' ':'');inner.appendChild(s);return s});
  const o={anchor,m,inner,spans,size,maxW};
  o.setSize=sz=>{o.size=sz;inner.style.fontSize=sz+'px';m.style.height=(sz*1.28)+'px';m.style.top=(-sz*.64)+'px'};
  o.setSize(size);return o;
}
function fit(o){const w=o.inner.scrollWidth;if(w>o.maxW)o.setSize(o.size*o.maxW/w)}
// mask reveal of spans: p 0..1 (from below), q 0..1 exit (to top)
function reveal(o,t,starts,dur=.42,ease=E.expo,exitAt=null,exitDur=.3){
  o.spans.forEach((s,i)=>{const st=Array.isArray(starts)?starts[i]:starts+i*.05;const p=ease(P(t,st,st+dur));
    let y=(1-p)*o.size*1.15;if(exitAt!=null){y-=E.i3(P(t,exitAt+i*.03,exitAt+i*.03+exitDur))*o.size*1.2}
    s.style.transform=`translateY(${y}px)`});
}

/* ---------------- BACKGROUND / GLOBAL LIGHT ---------------- */
const bg=div(stage,`width:${W}px;height:${H}px;background:var(--deep)`);
div(bg,`width:${W}px;height:${H}px;background:radial-gradient(60% 38% at 50% 22%,rgba(139,92,246,.20),rgba(139,92,246,0) 70%),radial-gradient(70% 40% at 50% 105%,rgba(91,33,182,.22),rgba(0,0,0,0) 70%)`);

const S={}; // scene layers (DOM order = z order)
for(const k of ['s6','s1','s2','s3','s4','s5'])S[k]=div(stage,'','','layer');

/* ================= SCENE 1 — THE HOOK (0–4s) ================= */
const s1={};
(()=>{
  const L1=S.s1;
  s1.cam=box(L1,W,H,'','','p3');
  const g=s1.phone=box(s1.cam,500,1020,'','','p3');
  s1.thick=[];
  for(let i=8;i>=1;i--){const c=Math.round(L(40,12,i/8));s1.thick.push(div(g,`width:500px;height:1020px;border-radius:72px;background:rgb(${c},${Math.round(c*.7)},${Math.round(c*1.5)});transform:translateZ(${-i*3.2}px)`))}
  s1.body=div(g,`width:500px;height:1020px;border-radius:72px;background:#0b0812;box-shadow:0 80px 140px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.07)`);
  div(s1.body,`inset:0;border-radius:72px;background:linear-gradient(125deg,rgba(255,255,255,.28),rgba(255,255,255,0) 22%,rgba(255,255,255,0) 72%,rgba(255,255,255,.10));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;padding:3px`);
  // empty digital space behind the screen
  s1.void=div(g,`left:20px;top:20px;width:460px;height:980px;border-radius:54px;overflow:hidden;background:#050309;transform:translateZ(1px)`);
  div(s1.void,`inset:-200px;background:repeating-linear-gradient(0deg,rgba(196,181,253,.10) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,rgba(196,181,253,.10) 0 1px,transparent 1px 46px);transform:perspective(500px) rotateX(58deg) translateY(160px)`);
  // generic social profile (intentionally unbranded)
  const r=rng(7);let tiles='';
  for(let i=0;i<9;i++){const g2=Math.round(185+r()*40),hue=r()<.4;tiles+=`<div class="abs" style="left:${(i%3)*154}px;top:${560+Math.floor(i/3)*154}px;width:152px;height:152px;background:${hue?`rgb(${g2-10},${g2-22},${g2+14})`:`rgb(${g2},${g2-4},${g2+6})`}"></div>`}
  let hl='';for(let i=0;i<4;i++)hl+=`<div class="abs" style="left:${24+i*100}px;top:436px;width:72px;height:72px;border-radius:50%;border:3px solid #d6d0e1;background:#eeebf3"></div>`;
  const profile=`
   <div class="abs" style="left:24px;top:22px;width:58px;height:14px;border-radius:7px;background:#1d1a24"></div>
   <div class="abs" style="left:370px;top:22px;width:66px;height:14px;border-radius:7px;background:#1d1a24"></div>
   <div class="abs" style="left:24px;top:66px;width:170px;height:22px;border-radius:6px;background:#2a2633"></div>
   <div class="abs" style="left:356px;top:62px;width:30px;height:30px;border-radius:8px;border:3px solid #2a2633"></div>
   <div class="abs" style="left:404px;top:62px;width:30px;height:30px;border-radius:50%;border:3px solid #2a2633"></div>
   <div class="abs" style="left:24px;top:112px;width:128px;height:128px;border-radius:50%;background:#dcd7e5;overflow:hidden"><div class="abs" style="left:40px;top:28px;width:48px;height:48px;border-radius:50%;background:#b8b1c6"></div><div class="abs" style="left:18px;top:86px;width:92px;height:70px;border-radius:46px 46px 0 0;background:#b8b1c6"></div></div>
   ${[0,1,2].map(i=>`<div class="abs" style="left:${186+i*92}px;top:146px;width:56px;height:24px;border-radius:6px;background:#2a2633"></div><div class="abs" style="left:${180+i*92}px;top:180px;width:68px;height:12px;border-radius:6px;background:#bdb6ca"></div>`).join('')}
   <div class="abs" style="left:24px;top:258px;font:700 26px Inter;color:#1d1a24">yourbusiness</div>
   <div class="abs" style="left:24px;top:302px;width:300px;height:14px;border-radius:7px;background:#cbc5d6"></div>
   <div class="abs" style="left:24px;top:326px;width:230px;height:14px;border-radius:7px;background:#cbc5d6"></div>
   <div class="abs" style="left:24px;top:362px;width:200px;height:50px;border-radius:12px;background:#e7e3ee"></div>
   <div class="abs" style="left:236px;top:362px;width:200px;height:50px;border-radius:12px;background:#e7e3ee"></div>
   ${hl}
   <div class="abs" style="left:0;top:540px;width:153px;height:3px;background:#1d1a24"></div>
   ${tiles}`;
  s1.screen=div(g,`left:20px;top:20px;width:460px;height:980px;border-radius:54px;overflow:hidden;background:#f6f4f9;transform:translateZ(2px)`,profile);
  // shards (triangulated copies of the screen)
  const cols=4,rows=8,pts=[];const rr=rng(21);
  for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){const edge=i==0||j==0||i==cols||j==rows;pts.push([i*460/cols+(edge?0:(rr()-.5)*80),j*980/rows+(edge?0:(rr()-.5)*80)])}
  const tris=[];for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=pts[j*(cols+1)+i],b=pts[j*(cols+1)+i+1],c=pts[(j+1)*(cols+1)+i],d=pts[(j+1)*(cols+1)+i+1];if((i+j)%2){tris.push([a,b,d],[a,d,c])}else{tris.push([a,b,c],[b,d,c])}}
  s1.shardG=div(g,`left:20px;top:20px;width:460px;height:980px;transform:translateZ(3px)`,'','p3');
  s1.shards=tris.map((tr,i)=>{
    const cx=(tr[0][0]+tr[1][0]+tr[2][0])/3,cy=(tr[0][1]+tr[1][1]+tr[2][1])/3;
    const d=div(s1.shardG,`width:460px;height:980px;border-radius:54px;overflow:hidden;background:#f6f4f9;clip-path:polygon(${tr.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')});transform-origin:${cx}px ${cy}px`,profile);
    const dx=cx-230,dy=cy-420,len=Math.hypot(dx,dy)||1;
    return{d,dir:[dx/len+(rr()-.5)*.5,dy/len+(rr()-.5)*.5],dist:500+rr()*900,z:250+rr()*1100,r:[(rr()-.5)*420,(rr()-.5)*420,(rr()-.5)*300],delay:len/600*.12};
  });
  // crack lines
  const lines=new Set();tris.forEach(tr=>{for(let k=0;k<3;k++){const a=tr[k],b=tr[(k+1)%3];lines.add(`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`)}});
  s1.cracks=div(g,`left:20px;top:20px;width:460px;height:980px;transform:translateZ(4px)`,`<svg width="460" height="980"><path d="${[...lines].join('')}" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`);
  // headline
  s1.lines=[['JUST AN',-178],['INSTAGRAM',0],['PAGE?',178]].map(([txt,y])=>{
    const o=tline(L1,txt,{size:190,y,maxW:990,mask:false});
    // chromatic layers for the distort beat
    o.ghosts=['#8b5cf6','#c4b5fd'].map(col=>{const gh=o.inner.cloneNode(true);gh.style.color=col;gh.style.position='absolute';gh.style.left='0';gh.style.top='0';gh.style.textShadow='none';gh.style.fontSize='1em';gh.style.padding='0 .08em';o.inner.appendChild(gh);return gh});
    return o;
  });
})();

function scene1(t){
  const on=t<4.05;show(S.s1,on);if(!on)return;
  // camera push + shake at the crack
  const shake=t>1.0&&t<1.45?(hash(Math.floor(t*30))-.5)*14*(1-P(t,1.0,1.45)):0;
  tf(s1.cam,{x:shake,y:shake*.6,s:L(1,1.08,E.io3(P(t,0,4)))});
  const enter=E.o5(P(t,0,1.15)),away=E.io3(P(t,1.3,3.2));
  tf(s1.phone,{y:-30+14*Math.sin(t*2.2),z:L(-650,0,enter)-900*away,ry:L(-40,-16,E.o3(P(t,0,1.3)))+34*away,rx:L(14,7,enter),rz:L(-8,-3,enter)});
  const bodyA=P(t,0,.25)*(1-P(t,2.2,3.0));
  [...s1.thick,s1.body,s1.void].forEach(e=>op(e,bodyA));
  const intact=t<1.25;op(s1.screen,intact?P(t,0,.25):0);
  op(s1.cracks,t>=1.0&&t<1.25?.9*P(t,1.0,1.06):0);
  show(s1.shardG,!intact);
  s1.shards.forEach(sh=>{const p=E.o5(P(t,1.25+sh.delay,2.9+sh.delay));
    tf(sh.d,{x:sh.dir[0]*sh.dist*p,y:sh.dir[1]*sh.dist*p,z:sh.z*p,rx:sh.r[0]*p,ry:sh.r[1]*p,rz:sh.r[2]*p});
    op(sh.d,intact?0:1-P(p,.55,1))});
  // headline: slam (1.5 / 1.75 / 2.0), distort (3.0), exit (3.35)
  const st=[1.5,1.75,2.0];
  s1.lines.forEach((o,i)=>{
    const p=P(t,st[i],st[i]+.32),e=E.expo(p);
    const glitch=t>2.98&&t<3.36;const q=Math.floor(t*24)+i*7;
    const jx=glitch?(hash(q)-.5)*70:0,sk=glitch?(hash(q+3)-.5)*24:0;
    const ex=E.i5(P(t,3.34+i*.05,3.74+i*.05));
    tf(o.anchor,{x:jx+(i%2?1:-1)*1500*ex,z:L(900,0,e),rx:L(-38,0,e),sk:sk+(i%2?1:-1)*28*ex,s:1});
    op(o.inner,P(t,st[i],st[i]+.04));
    const sep=glitch?L(6,34,hash(q+9)):0;
    o.ghosts[0].style.transform=`translate(${-sep}px,${glitch?(hash(q+1)-.5)*16:0}px)`;
    o.ghosts[1].style.transform=`translate(${sep}px,${glitch?(hash(q+2)-.5)*16:0}px)`;
    o.ghosts.forEach(g=>g.style.opacity=sep>1?.9:0);
    o.inner.style.textShadow=extrude(-1.2,1.6,10);
  });
}

/* ============ SCENE 2 — WEBSITE DEVELOPMENT (4–10s) ============ */
const s2={};
const DESK={w:900,h:644},MOB={w:420,h:880};
const MODS={ // [x,y,w,h] in content coords (content = frame minus 44px chrome)
  nav:[[0,0,900,60],[0,0,420,60]],
  text:[[44,100,420,190],[24,84,372,150]],
  img:[[500,100,356,256],[24,250,372,200]],
  cta:[[44,318,190,56],[24,466,190,56]],
  c0:[[44,400,256,160],[24,540,372,84]],
  c1:[[316,400,256,160],[24,636,372,84]],
  c2:[[588,400,256,160],[24,732,372,84]],
};
(()=>{
  const L2=S.s2;
  s2.world=box(L2,W,H,'','','p3');
  s2.field=box(s2.world,W,H,'','','p3');
  const r=rng(99),cols=['#f7f5ff','#8b5cf6','#5b21b6','#c4b5fd'];
  s2.shapes=[];for(let i=0;i<30;i++){
    const type=i%6,sz=40+r()*130,col=cols[i%4];
    let css=`width:${sz}px;height:${sz}px;left:${-sz/2}px;top:${-sz/2}px;`;
    if(type==0)css+=`border:3px solid ${col}`;else if(type==1)css+=`background:${col}`;else if(type==2)css+=`border:3px solid ${col};border-radius:50%`;
    else if(type==3)css+=`background:${col};border-radius:50%;width:${sz*.5}px;height:${sz*.5}px`;else if(type==4)css+=`background:${col};clip-path:polygon(50% 0,100% 100%,0 100%)`;else css+=`background:${col};height:${sz*.18}px`;
    s2.shapes.push({d:div(s2.field,css),x:(r()-.5)*1300,y:(r()-.5)*1900,z:-1400+r()*1500,rs:(r()-.5)*90,tx:(r()-.5)*820,ty:(r()-.5)*560,ph:r()*6});
  }
  // floor + environment forms (revealed by camera move)
  s2.floor=box(s2.world,2400,2400,`background:repeating-linear-gradient(0deg,rgba(196,181,253,.13) 0 2px,transparent 2px 120px),repeating-linear-gradient(90deg,rgba(196,181,253,.13) 0 2px,transparent 2px 120px);-webkit-mask:radial-gradient(closest-side,#000,transparent)`);
  s2.slab=box(s2.world,260,900,`background:#5b21b6;box-shadow:inset -30px 0 60px rgba(0,0,0,.35)`);
  s2.slab2=box(s2.world,140,140,`background:#f7f5ff`);
  s2.ring=box(s2.world,520,520,`border:26px solid #2a1352;border-radius:50%`);
  // browser
  s2.B=box(s2.world,DESK.w,DESK.h,'','','p3');
  s2.shadow=box(s2.world,700,120,`background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);`);
  s2.frame=div(s2.B,`inset:0;border-radius:22px;background:#fbfaff;box-shadow:0 70px 140px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.4)`,'','p3');
  s2.chrome=div(s2.frame,`left:0;top:0;right:0;height:44px;border-radius:22px 22px 0 0;background:#ebe7f4`,
    `<div class="abs" style="left:20px;top:16px;width:12px;height:12px;border-radius:50%;background:#c9c2d8;box-shadow:20px 0 #c9c2d8,40px 0 #c9c2d8"></div>`);
  s2.url=div(s2.chrome,`top:9px;height:26px;border-radius:13px;background:#fff;font:500 14px 'JetBrains Mono';color:#7a7290;display:flex;align-items:center;justify-content:center`,'yourbusiness.ge');
  s2.content=div(s2.frame,`left:0;top:44px;right:0;bottom:0`,'','p3');
  const c=s2.content,M=s2.m={};
  M.grid=div(c,`inset:0 44px;background:repeating-linear-gradient(90deg,rgba(139,92,246,.16) 0 58px,transparent 58px 72px);transform:translateZ(1px)`);
  M.nav=div(c,`background:#0c0915;border-radius:0`,`<div class="abs" style="left:24px;top:20px;width:20px;height:20px;background:#8b5cf6"></div><div class="abs" style="left:54px;top:19px;font:800 17px Inter;color:#fff">Your Brand</div>`);
  M.links=div(M.nav,`right:28px;top:26px;width:300px;height:8px`,[0,1,2,3].map(i=>`<div class="abs" style="left:${i*72}px;top:0;width:54px;height:8px;border-radius:4px;background:rgba(255,255,255,${i==3?.9:.35})"></div>`).join(''));
  M.burger=div(M.nav,`right:24px;top:21px;width:26px;height:18px;border-top:3px solid #fff;border-bottom:3px solid #fff`,`<div class="abs" style="left:0;top:4.5px;width:26px;height:3px;background:#fff"></div>`);
  M.text=div(c,``);
  M.tl=['Crafted for','your','business.'].map((w,i)=>{const m=div(M.text,`left:0;overflow:hidden;width:420px`);const s=div(m,`position:relative;font-family:'Archivo Black';color:${i==2?'#5b21b6':'#0c0915'};letter-spacing:-.02em;white-space:nowrap;line-height:1.05`,w);return{m,s}});

/* ============ SCENE 5 — BRAND REVEAL (22–27s) ============ */
const s5={};
function zebra(t,warp,vis,cnt=14,th=110){
  let d='';
  for(let k=0;k<cnt;k++){
    const yc=1300+(k-6.5)*200,a=k*1.7,b=k*2.3;
    const v=vis?vis(k):1;if(v<=0)continue;const x0=900-900*v,x1=900+900*v;
    const top=[],bot=[];
    for(let x=x0;x<=x1+.1;x+=(x1-x0)/40){
      const disp=warp*(95*Math.sin(x*.0034+a+t*1.1)+42*Math.sin(x*.0092+b-t*.6)+(x-900)*.18*Math.sin(k*.9));
      const tt=th/2*(1+warp*.55*Math.sin(x*.0047+a*1.3+t*.4));const tb=th/2*(1+warp*.55*Math.sin(x*.0053+b*1.1-t*.3));
      top.push(`${x.toFixed(1)} ${(yc-Math.max(4,tt)+disp).toFixed(1)}`);bot.push(`${x.toFixed(1)} ${(yc+Math.max(4,tb)+disp).toFixed(1)}`);
    }
    d+=`M${top.join('L')}L${bot.reverse().join('L')}Z`;
  }
  return d;
}

function scene5(t){

  op(s5.wrap,1-P(t,26.8,27.0));
  const bgA=P(t,23.3,23.5)*(1-P(t,26.6,27.0));op(s5.bg,bgA);op(s5.spot,bgA);
  // wordmark (placeholder typography — swap for official logo)

  w.inner.style.letterSpacing=L(.16,.02,E.o3(P(t,24.0,26.6)))+'em';
  const sc=L(1,.3,out);tf(w.anchor,{y:L(0,-752,out),s:sc});
  w.inner.style.textShadow=extrude(0,2.4*(1-out),18);
