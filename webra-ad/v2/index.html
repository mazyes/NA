<!doctype html>
<html lang="ka"><head><meta charset="utf-8">
<title>WEBRA Spot v2</title>
<style>
@font-face{font-family:FiraGO;font-weight:500;src:url(../fonts/FiraGO-Medium.woff2) format('woff2')}
@font-face{font-family:FiraGO;font-weight:600;src:url(../fonts/FiraGO-SemiBold.woff2) format('woff2')}
@font-face{font-family:FiraGO;font-weight:700;src:url(../fonts/FiraGO-Bold.woff2) format('woff2')}
@font-face{font-family:FiraGO;font-weight:800;src:url(../fonts/FiraGO-ExtraBold.woff2) format('woff2')}
:root{--ink:#07050c;--bg:#11061f;--plum:#1a0a33;--purple:#5b21b6;--violet:#8b5cf6;--lav:#c9bdfc;--white:#f7f5ff}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;font-family:FiraGO,sans-serif;color:var(--white);font-kerning:normal}
.abs{position:absolute;left:0;top:0;box-sizing:border-box}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2200px;perspective-origin:50% 45%}
.p3{transform-style:preserve-3d}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 20px FiraGO;background:rgba(0,0,0,.5);cursor:pointer;z-index:9}
</style></head>
<body>
<div id="stage"></div>
<script>
/* =====================================================================
   WEBRA — 30s vertical spot, v2 (Georgian). Deterministic: seek(t).
   Official logo: place the original file at brand/logo.svg or brand/logo.png
   ===================================================================== */
const COPY={
  hook1:'მხოლოდ Instagram-ის', hook2:'გვერდი გაქვს?', hook3:'შენს ბიზნესს მეტი სჭირდება.',
  build:'შექმენი.', buildSub:'ვებგვერდის დიზაინი და დეველოპმენტი',
  query:'ყვავილების მიტანა თბილისში',
  found:'გამოჩნდი.', foundSub1:'SEO და Google Business Profile-ის', foundSub2:'ოპტიმიზაცია',
  auto:'ავტომატიზაცია.', autoSub:'რუტინული ამოცანების AI ავტომატიზაცია',
  manual:'ხელით', automated:'ავტომატურად',
  tasks:['ახალი მოთხოვნა','ჯავშნის დადასტურება','ინვოისი','შეხსენება','პასუხი კლიენტს','კვირის ანგარიში'],
  tagline:'შექმენი. გამოჩნდი. ავტომატიზაცია.',
  cta1:'დაგვიკავშირდი და დაიწყე', cta2:'შენი ბიზნესის განვითარება ონლაინ!',
  ig:'@webra.agency', web:'webraagency.dev',
};
const W=1080,H=1920,CX=540,CY=960,DUR=30;
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>C((t-a)/(b-a)), L=(a,b,p)=>a+(b-a)*p;
// one motion language: cubic-bezier curves + a damped spring for physical objects
function bez(x1,y1,x2,y2){return p=>{if(p<=0)return 0;if(p>=1)return 1;let u=p;for(let i=0;i<8;i++){const cx=3*x1*u*(1-u)**2+3*x2*u*u*(1-u)+u**3-p;const d=3*x1*(1-u)**2+6*(x2-x1)*u*(1-u)+3*(1-x2)*u*u;if(Math.abs(d)<1e-6)break;u-=cx/d;u=C(u)}return 3*y1*u*(1-u)**2+3*y2*u*u*(1-u)+u**3}}
const E={out:bez(.16,1,.3,1), inOut:bez(.65,0,.35,1), in:bez(.6,0,.9,.4), soft:bez(.33,0,.2,1)};
const spring=(p,z=.72)=>{if(p<=0)return 0;if(p>=1)return 1;const w=11,t=p*1.15,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const stage=document.getElementById('stage');
function div(parent,css='',html='',cls=''){const d=document.createElement('div');d.className='abs '+cls;d.style.cssText=css;d.innerHTML=html;parent.appendChild(d);return d}
function box(parent,w,h,css='',html='',cls=''){return div(parent,`left:${CX-w/2}px;top:${CY-h/2}px;width:${w}px;height:${h}px;`+css,html,cls)}
const full=(p,css='',cls='p3')=>div(p,`width:${W}px;height:${H}px;`+css,'',cls);
function tf(e,o={}){const{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,sx=1,sy=1}=o;e.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s*sx},${s*sy})`}
function op(e,a){a=C(a);e.style.opacity=a;e.style.visibility=a<=.002?'hidden':'visible'}
function show(e,on){e.style.display=on?'':'none'}
function rect(e,x,y,w,h){e.style.left=x+'px';e.style.top=y+'px';e.style.width=w+'px';e.style.height=h+'px'}
const depth=(n=6,c='#3a1673')=>{let s=[];for(let i=1;i<=n;i++)s.push(`0 ${i}px 0 ${c}`);s.push(`0 ${n+10}px 30px rgba(0,0,0,.35)`);return s.join(',')};

// masked kinetic line (word spans). Georgian needs generous mask height for ascenders/descenders.
function tline(parent,txt,{size=120,y=0,weight=800,color='var(--white)',maxW=940,ls=-.01,shadow=true}={}){
  const anchor=div(parent,`left:0;top:${CY+y}px;width:${W}px;height:0;`);
  const m=div(anchor,`left:0;width:${W}px;display:flex;justify-content:center;align-items:center;overflow:hidden;`);
  const inner=div(m,`position:relative;font-family:FiraGO;font-weight:${weight};color:${color};letter-spacing:${ls}em;white-space:nowrap;line-height:1.25;padding:0 .06em;${shadow?'text-shadow:'+depth(weight>=700?6:0):''}`);
  const parts=txt.split(' ');
  const spans=parts.map((p,i)=>{const s=document.createElement('span');s.style.cssText='display:inline-block;white-space:pre';s.textContent=p+(i<parts.length-1?' ':'');inner.appendChild(s);return s});
  const o={anchor,m,inner,spans,size,maxW};
  o.setSize=sz=>{o.size=sz;inner.style.fontSize=sz+'px';m.style.height=(sz*1.7)+'px';m.style.top=(-sz*.85)+'px'};
  o.setSize(size);return o;
}
function fit(o){const w=o.inner.scrollWidth;if(w>o.maxW)o.setSize(o.size*o.maxW/w)}
// words rise from the mask on given start times; exit lifts them out
function reveal(o,t,st,exitAt=null,gap=.1){
  o.spans.forEach((s,i)=>{const a=(Array.isArray(st)?st[i]:st+i*gap);const p=E.out(P(t,a,a+.7));
    let y=(1-p)*o.size*1.3;let gone=false;if(exitAt!=null){const q=P(t,exitAt+i*.04,exitAt+i*.04+.35);y-=E.in(q)*o.size*1.9;gone=q>=1}
    s.style.transform=`translateY(${y.toFixed(2)}px)`;s.style.visibility=(gone||t<a)?'hidden':'visible'});
}

/* ---------------- WORLD / LIGHT ---------------- */
const bg=full(stage,'background:var(--bg)','');
div(bg,`width:${W}px;height:${H}px;background:radial-gradient(70% 34% at 50% 8%,rgba(139,92,246,.16),rgba(139,92,246,0) 72%)`);
const pool=div(bg,`left:-160px;top:1180px;width:1400px;height:640px;background:radial-gradient(closest-side,rgba(120,70,220,.20),rgba(120,70,220,0))`);

const LY={};for(const k of ['main','auto','brand'])LY[k]=div(stage,'','','layer');

/* ================= MAIN: phone -> website -> search (0–15.8s) ================= */
const M={};
const DEV={phone:[420,860],desk:[900,620],mob:[420,860],bar:[900,124]};
const MODS={nav:[[0,0,900,58],[0,0,420,58]],text:[[40,92,440,190],[24,80,372,160]],img:[[500,92,360,262],[24,256,372,196]],cta:[[40,300,200,54],[24,468,200,54]]};
MODS.c0=[[40,388,264,142],[24,542,372,84]];MODS.c1=[[318,388,264,142],[24,638,372,84]];MODS.c2=[[596,388,264,142],[24,734,372,84]];
(()=>{
  const Lm=LY.main;
  M.world=full(Lm);
  M.shadow=box(M.world,700,90,`background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0))`);
  M.dev=box(M.world,420,860,`border-radius:56px;background:#0b0812`);
  M.devEdge=div(M.dev,`inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.30),rgba(255,255,255,0) 20%,rgba(255,255,255,0) 75%,rgba(255,255,255,.10));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;padding:2.5px`);
  M.scr=div(M.dev,`overflow:hidden;background:#f7f5fb`);
  // --- generic social profile (unbranded) ---
  const r=rng(7);let tiles='';
  for(let i=0;i<15;i++){const g=Math.round(190+r()*38),v=r()<.35;tiles+=`<div class="abs" style="left:${(i%3)*131}px;top:${Math.floor(i/3)*131}px;width:129px;height:129px;background:${v?`rgb(${g-14},${g-26},${g+10})`:`rgb(${g},${g-4},${g+6})`}"></div>`}
  M.profile=div(M.scr,`left:0;top:0;width:392px;height:832px`,`
   <div class="abs" style="left:22px;top:22px;width:52px;height:12px;border-radius:6px;background:#1d1a24"></div>
   <div class="abs" style="left:318px;top:22px;width:52px;height:12px;border-radius:6px;background:#1d1a24"></div>
   <div class="abs" style="left:22px;top:60px;width:150px;height:20px;border-radius:6px;background:#2a2633"></div>
   <div class="abs" style="left:22px;top:104px;width:112px;height:112px;border-radius:50%;background:#dcd7e5;overflow:hidden"><div class="abs" style="left:35px;top:24px;width:42px;height:42px;border-radius:50%;background:#b8b1c6"></div><div class="abs" style="left:16px;top:76px;width:80px;height:60px;border-radius:40px 40px 0 0;background:#b8b1c6"></div></div>
   ${[0,1,2].map(i=>`<div class="abs" style="left:${164+i*76}px;top:134px;width:48px;height:20px;border-radius:6px;background:#2a2633"></div><div class="abs" style="left:${158+i*76}px;top:164px;width:60px;height:10px;border-radius:5px;background:#bdb6ca"></div>`).join('')}
   <div class="abs" style="left:22px;top:236px;width:190px;height:18px;border-radius:6px;background:#2a2633"></div>
   <div class="abs" style="left:22px;top:268px;width:270px;height:12px;border-radius:6px;background:#cbc5d6"></div>
   <div class="abs" style="left:22px;top:290px;width:210px;height:12px;border-radius:6px;background:#cbc5d6"></div>
   <div class="abs" style="left:22px;top:322px;width:170px;height:44px;border-radius:10px;background:#e7e3ee"></div>
   <div class="abs" style="left:200px;top:322px;width:170px;height:44px;border-radius:10px;background:#e7e3ee"></div>
   <div class="abs" style="left:0;top:392px;width:392px;height:1px;background:#e2dde9"></div>`);
  M.feed=div(M.profile,`left:0;top:400px;width:392px;height:700px`,tiles);
  // --- website ---
  M.site=div(M.scr,`inset:0`);
  M.chrome=div(M.site,`left:0;top:0;right:0;height:44px;background:#ece8f4`,`<div class="abs" style="left:20px;top:16px;width:12px;height:12px;border-radius:50%;background:#cbc4da;box-shadow:20px 0 #cbc4da,40px 0 #cbc4da"></div>`);
  M.url=div(M.chrome,`top:9px;height:26px;border-radius:13px;background:#fff;font:500 14px FiraGO;color:#7a7290;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden`,'yourbusiness.ge');
  M.content=div(M.site,`left:0;top:44px;right:0;bottom:0;overflow:hidden`);
  const c=M.content,m=M.m={};
  m.grid=div(c,`inset:0 40px;background:repeating-linear-gradient(90deg,rgba(139,92,246,.13) 0 60px,transparent 60px 75px)`);
  m.nav=div(c,`background:#0c0915`,`<div class="abs" style="left:22px;top:19px;width:20px;height:20px;border-radius:5px;background:#8b5cf6"></div><div class="abs" style="left:52px;top:18px;width:90px;height:10px;top:24px;border-radius:5px;background:rgba(255,255,255,.85)"></div>`);
  m.links=div(m.nav,`right:26px;top:25px;width:290px;height:8px`,[0,1,2,3].map(i=>`<div class="abs" style="left:${i*72}px;top:0;width:52px;height:8px;border-radius:4px;background:rgba(255,255,255,${i==3?.9:.35})"></div>`).join(''));
  m.burger=div(m.nav,`right:22px;top:20px;width:26px;height:18px;border-top:3px solid #fff;border-bottom:3px solid #fff`,`<div class="abs" style="left:0;top:4.5px;width:26px;height:3px;background:#fff"></div>`);
  m.text=div(c,``);
  m.tl=[['#0c0915',1],['#0c0915',.7],['#5b21b6',.85]].map(([col,wd],i)=>{const mm=div(m.text,`left:0;overflow:hidden`);const s=div(mm,`left:0;top:0;height:100%;border-radius:8px;background:${col}`);return{mm,s,wd}});
  m.img=div(c,`border-radius:16px;overflow:hidden;background:#1d0b3b`,`<div class="abs" style="inset:-60%;background:repeating-linear-gradient(118deg,#f7f5ff 0 22px,#1d0b3b 22px 58px,#f7f5ff 58px 70px,#1d0b3b 70px 118px);transform:rotate(-8deg) skewY(6deg)"></div>`);
  m.cta=div(c,`border-radius:27px;background:#5b21b6`,`<div class="abs" style="left:28px;top:22px;width:110px;height:10px;border-radius:5px;background:rgba(255,255,255,.9)"></div>`);
  ['c0','c1','c2'].forEach((k,i)=>{m[k]=div(c,`border-radius:14px;background:#f0ecfa`);
    m[k+'i']=div(m[k],`width:38px;height:38px;border-radius:10px;background:${i==1?'#0c0915':'#8b5cf6'}`);
    m[k+'l']=div(m[k],`width:150px;height:30px`,`<div class="abs" style="left:0;top:0;width:150px;height:11px;border-radius:6px;background:#3b3450"></div><div class="abs" style="left:0;top:20px;width:110px;height:9px;border-radius:5px;background:#c3bcd3"></div>`)});
  // --- search bar ---
  M.search=div(M.dev,`inset:0`);
  M.lens=div(M.search,`left:46px;top:40px;width:40px;height:40px;border-radius:50%;border:5px solid #5b21b6`);
  div(M.search,`left:80px;top:78px;width:18px;height:5px;border-radius:3px;background:#5b21b6;transform:rotate(45deg)`);
  M.q=div(M.search,`left:124px;top:0;height:124px;display:flex;align-items:center;font:500 40px FiraGO;color:#0c0915;white-space:pre`);
  M.caret=div(M.search,`top:38px;width:3px;height:48px;background:#8b5cf6`);
  M.go=div(M.search,`right:14px;top:14px;width:96px;height:96px;border-radius:50%;background:#5b21b6`,`<div class="abs" style="left:31px;top:45px;width:32px;height:6px;background:#fff;border-radius:3px"></div><div class="abs" style="left:45px;top:36px;width:18px;height:18px;border-top:6px solid #fff;border-right:6px solid #fff;transform:rotate(45deg);box-sizing:border-box"></div>`);
  // --- results ---
  M.rows=[0,1].map(()=>box(M.world,900,112,`border-radius:22px;background:rgba(247,245,255,.06);border:1px solid rgba(247,245,255,.10)`,`<div class="abs" style="left:28px;top:30px;width:52px;height:52px;border-radius:12px;background:rgba(247,245,255,.14)"></div><div class="abs" style="left:104px;top:34px;width:380px;height:16px;border-radius:8px;background:rgba(247,245,255,.26)"></div><div class="abs" style="left:104px;top:64px;width:260px;height:12px;border-radius:6px;background:rgba(247,245,255,.14)"></div>`));
  M.card=box(M.world,900,330,`border-radius:28px;background:#fbfaff;box-shadow:0 50px 100px rgba(0,0,0,.45),0 0 0 3px #8b5cf6`);
  M.map=div(M.card,`left:30px;top:30px;width:200px;height:270px;border-radius:18px;overflow:hidden;background:#1d0b3b`,
    `<svg width="200" height="270" style="position:absolute;left:0;top:0"><g fill="none" stroke="#f7f5ff" stroke-linecap="round" opacity=".9"><path d="M-10 60 C60 40 110 100 210 70" stroke-width="10"/><path d="M-10 150 C70 170 120 120 210 160" stroke-width="16"/><path d="M-10 230 C50 210 140 260 210 220" stroke-width="8"/><path d="M70 -10 C60 90 110 180 90 280" stroke-width="6" opacity=".5"/><path d="M150 -10 C170 90 130 180 160 280" stroke-width="5" opacity=".5"/></g></svg>`);
  M.pin=div(M.map,`left:78px;top:88px;width:46px;height:46px;border-radius:50% 50% 50% 0;background:#8b5cf6;box-shadow:0 0 0 4px #1d0b3b`,`<div class="abs" style="left:15px;top:15px;width:16px;height:16px;border-radius:50%;background:#fff"></div>`);
  M.cName=div(M.card,`left:262px;top:40px;font:800 46px FiraGO;color:#0c0915;white-space:nowrap`,'შენი ბიზნესი');
  M.cCat=div(M.card,`left:262px;top:110px;font:500 28px FiraGO;color:#6f6883;white-space:nowrap`,'ყვავილების მაღაზია · თბილისი');
  M.chips=['ვებგვერდი','მარშრუტი','დარეკვა'].map((w,i)=>div(M.card,`left:${262+[0,188,380][i]}px;top:196px;height:64px;padding:0 24px;border-radius:32px;border:2.5px solid #5b21b6;font:600 26px FiraGO;color:#5b21b6;display:flex;align-items:center;white-space:nowrap`,w));
  M.rings=[0,1].map(()=>box(M.world,80,80,`border:2px solid rgba(201,189,252,.7);border-radius:50%`));
  // --- headlines ---
  M.h1=tline(Lm,COPY.hook1,{size:104,y:-700});M.h2=tline(Lm,COPY.hook2,{size:104,y:-570});
  M.h3=tline(Lm,COPY.hook3,{size:50,y:-445,weight:500,color:'var(--lav)',shadow:false});
  M.b1=tline(Lm,COPY.build,{size:160,y:-690});M.b2=tline(Lm,COPY.buildSub,{size:46,y:-545,weight:500,color:'var(--lav)',shadow:false});
  M.f1=tline(Lm,COPY.found,{size:160,y:-700});M.f2=tline(Lm,COPY.foundSub1,{size:44,y:-560,weight:500,color:'var(--lav)',shadow:false});M.f3=tline(Lm,COPY.foundSub2,{size:44,y:-500,weight:500,color:'var(--lav)',shadow:false});
})();

function main(t){
  const on=t<16;show(LY.main,on);if(!on)return;
  const pan=E.inOut(P(t,14.9,15.9));tf(M.world,{y:-1250*pan});
  // --- device morph chain ---
  const mA=E.inOut(P(t,3.7,4.7)),mB=E.inOut(P(t,7.0,8.0)),mC=E.inOut(P(t,9.1,10.0));
  let[w,h]=DEV.phone;w=L(w,DEV.desk[0],mA);h=L(h,DEV.desk[1],mA);w=L(w,DEV.mob[0],mB);h=L(h,DEV.mob[1],mB);w=L(w,DEV.bar[0],mC);h=L(h,DEV.bar[1],mC);
  const d=M.dev;d.style.width=w+'px';d.style.height=h+'px';d.style.left=(CX-w/2)+'px';d.style.top=(CY-h/2)+'px';
  const inset=L(14,0,mA);rect(M.scr,inset,inset,w-2*inset,h-2*inset);
  const rad=L(L(L(56,18,mA),28,mB),62,mC);d.style.borderRadius=rad+'px';M.scr.style.borderRadius=Math.max(0,rad-inset)+'px';
  d.style.background=mA<1?'#0b0812':'#fbfaff';op(M.devEdge,1-mA);
  // gentle, continuous camera orbit on the object (no random motion)
  const arrive=spring(P(t,0,1.4),.9);
  const yDev=L(L(170,150,mA),-330,mC);
  const ry=L(L(-14+6*P(t,0,3.7),-8,mA)+10*E.inOut(P(t,4.7,8.8)),0,mC);
  const rx=L(6,0,mC)+L(0,-2,mB)*(1-mC);
  const float=(1-mC)*6*Math.sin(t*1.4);
  tf(d,{y:yDev+float,z:L(-260,0,arrive),ry,rx,s:1});
  d.style.boxShadow=mC>.5?'0 40px 90px rgba(0,0,0,.45)':`${(-ry*.45).toFixed(1)}px 0 0 #2c2140, 0 70px 120px rgba(0,0,0,.5)`;
  d.style.webkitBoxReflect=mC<.3?`below ${L(150,70,mA).toFixed(0)}px linear-gradient(transparent 72%, rgba(255,255,255,${(.16*(1-mC/.3)).toFixed(3)}))`:'none';

/* ================= ZEBRA -> LOGO -> END CARD (20.7–30s) ================= */
const B={};
function zebra(t,warp,vis,cnt=14,th=110){
  let d='';
  for(let k=0;k<cnt;k++){
    const yc=1300+(k-6.5)*200,a=k*1.7,b=k*2.3;const v=vis?vis(k):1;if(v<=0)continue;const x0=900-900*v,x1=900+900*v;
    const top=[],bot=[];
    for(let i=0;i<=48;i++){const x=L(x0,x1,i/48);
      const disp=warp*(95*Math.sin(x*.0034+a+t*.55)+40*Math.sin(x*.0092+b-t*.3)+(x-900)*.16*Math.sin(k*.9));
      const tt=th/2*(1+warp*.5*Math.sin(x*.0047+a*1.3+t*.2)),tb=th/2*(1+warp*.5*Math.sin(x*.0053+b*1.1-t*.15));
      top.push(`${x.toFixed(1)} ${(yc-Math.max(5,tt)+disp).toFixed(1)}`);bot.push(`${x.toFixed(1)} ${(yc+Math.max(5,tb)+disp).toFixed(1)}`)}
    d+=`M${top.join('L')}L${bot.reverse().join('L')}Z`;
  }
  return d;
}

function brand(t){
